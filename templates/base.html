<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Flight-Smart | Temukan Waktu Terbaik Membeli Tiket{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .hero-flight {
        background-image: linear-gradient(110deg, rgba(0, 39, 90, .98) 15%, rgba(0, 39, 90, .76) 55%, rgba(0, 39, 90, .35)), url("https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=1800&q=85");
        background-position: center;
        background-size: cover;
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              navy: "#00275A",
              ocean: "#14568E",
              orange: "#F86A00"
            },
            fontFamily: {
              sans: ["Poppins", "ui-sans-serif", "system-ui", "sans-serif"]
            }
          }
        }
      };
    </script>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900 flex flex-col">
    <nav class="relative z-30 bg-navy text-white">
      <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
        <div class="flex h-[72px] items-center justify-between">
          <a href="{{ url_for('index') }}" class="flex items-center gap-2 text-xl font-extrabold tracking-tight"><span class="flex h-9 w-9 items-center justify-center rounded-xl bg-orange text-lg">✈</span>Flight<span class="text-orange">-Smart</span></a>
          <button id="menu-button" type="button" class="rounded-lg p-2 hover:bg-white/10 md:hidden" aria-label="Buka menu" aria-expanded="false"><span class="text-2xl">☰</span></button>
          <div id="menu" class="hidden items-center gap-8 text-sm font-medium md:flex">
            <a href="{{ url_for('index') }}" class="{% if request.path == '/' %}text-orange underline decoration-1 underline-offset-8{% else %}text-white transition hover:text-orange{% endif %}">Beranda</a>
            <a href="/#fitur" class="text-white transition hover:text-orange">Fitur</a>
            <a href="/#faq" class="text-white transition hover:text-orange">FAQ</a>
            <a href="{{ url_for('chat') }}" class="rounded-full border border-white/40 px-5 py-2 text-white transition hover:border-orange hover:text-orange {% if request.path == '/chat' %}border-orange text-orange underline decoration-1 underline-offset-4{% endif %}">Flight-Bot</a>
          </div>
        </div>
        <div id="mobile-menu" class="hidden space-y-3 pb-5 text-sm font-medium md:hidden">
          <a href="{{ url_for('index') }}" class="block {% if request.path == '/' %}text-orange underline decoration-1 underline-offset-4{% else %}text-white hover:text-orange{% endif %}">Beranda</a>
          <a href="/#fitur" class="block text-white hover:text-orange">Fitur</a>
          <a href="/#faq" class="block text-white hover:text-orange">FAQ</a>
          <a href="{{ url_for('chat') }}" class="block text-white hover:text-orange {% if request.path == '/chat' %}text-orange underline decoration-1 underline-offset-4{% endif %}">Flight-Bot</a>
        </div>
      </div>
    </nav>

    <main class="flex-1">
      {% block content %}{% endblock %}
    </main>

    <footer class="bg-navy text-slate-300">
      <div class="mx-auto flex max-w-7xl flex-col gap-4 px-4 py-8 text-sm sm:px-6 md:flex-row md:items-center md:justify-between lg:px-8">
        <a href="{{ url_for('index') }}" class="text-lg font-extrabold text-white">Flight<span class="text-orange">-Smart</span></a>
        <p>&copy; 2026 Flight-Smart. Asisten perjalanan dan analitik harga tiket.</p>
        <div class="flex gap-4"><a href="{{ url_for('dashboard') }}" class="hover:text-orange">Analitik</a><a href="{{ url_for('chat') }}" class="hover:text-orange">Bantuan</a></div>
      </div>
    </footer>

    <script>
      document.getElementById("menu-button").addEventListener("click", function () {
        document.getElementById("mobile-menu").classList.toggle("hidden");
        this.setAttribute("aria-expanded", this.getAttribute("aria-expanded") !== "true");
      });
    </script>
  </body>
</html>
